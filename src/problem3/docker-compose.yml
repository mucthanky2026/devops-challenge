version: "3.9"

services:
  nginx:
    image: nginx:1.25
    ports:
      - "8080:80"
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}
      - API_PORT=${API_PORT:-3000}
      - API_NAME=${API_NAME:-api}
    volumes:
      # - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/template:/etc/nginx/templates
    depends_on:
      - api

  api:
    build: ./api
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - API_PORT=${API_PORT:-3000}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis:7
