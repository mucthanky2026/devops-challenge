name: Frontend Non-Prod Pipeline

on:
  pull_request:
    branches: 
        - "main"
    types: 
        - closed
    paths:
      - 'src/frontend/**'
      - 'frontend/**'

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                node-version: '24'
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npx --no-install eslint . --max-warnings=0
            - name: Unit tests and coverage
              run: |
                npx --no-install vitest run \
                --coverage \
                --coverage.reporter=text \
                --coverage.reporter=lcov
            - name: SonarQube analysis and quality gate
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
                SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
              run: |
                sonar-scanner \
                -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
                -Dsonar.sources=. \
                '-Dsonar.exclusions=node_modules/**,.next/**,out/**,dist/**,coverage/**' \
                -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
                -Dsonar.qualitygate.wait=true \
                -Dsonar.qualitygate.timeout=300
            - name: Secret scan
              run: gitleaks git . --redact --exit-code 1
            - name: Dependency vulnerability scan
              run: |
                trivy fs \
                    --scanners vuln \
                    --include-dev-deps \
                    --severity HIGH,CRITICAL \
                    --exit-code 1 \
                    .
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        needs: check
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                node-version: '24'
            - name: Install dependencies
              run: npm ci
            - name: Build artifact
              run: npm run build
            - name: Authorize AWS
              uses: aws-actions/configure-aws-credentials@v2
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}
                role-external-id: ${{ secrets.AWS_EXTERNAL_ID }}
                mask-aws-account-id: true
                role-session-name: frontend-merge-${{ github.sha }}

            - name: Upload build artifact to S3
              run: |
                aws s3 sync out/ s3://${{ vars.AWS_S3_ARTIFACT_BUCKET }}/frontend/${{ github.sha }} \
                --delete \
                --exact-timestamps \
                --acl private
    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Authorize AWS
              uses: aws-actions/configure-aws-credentials@v2
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}
                role-external-id: ${{ secrets.AWS_EXTERNAL_ID }}
                mask-aws-account-id: true
                role-session-name: frontend-merge-${{ github.sha }}
            - name: Download build artifact from S3
              run: |
                aws s3 sync s3://${{ vars.AWS_S3_ARTIFACT_BUCKET }}/frontend/${{ github.sha }} out/ \
                --exact-timestamps
            - name: Upload to S3 for deployment
              run: |
                aws s3 cp --recursive out/ s3://${{ vars.AWS_S3_DEPLOY_BUCKET }}/ --acl private 
                aws s3 cp config/nprd/frontend/config.json s3://${{ vars.AWS_S3_DEPLOY_BUCKET }}/config.json --acl private
            - name: Invalidate CloudFront cache
              run: |
                aws cloudfront create-invalidation \
                --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
                --paths "/index.html" "/config.json" "/manifest.json" "/robots.txt"
    verify:
        runs-on: ubuntu-latest
        needs: deploy
        steps:
            - name: Verify deployment
              run: |
                curl -v https://${{ vars.FRONTEND_DOMAIN }}/index.html || exit 1
                curl -v https://${{ vars.FRONTEND_DOMAIN }} | grep "200 OK" || exit 1

    notify:
        runs-on: ubuntu-latest
        needs: [check, build, deploy, verify]
        steps:
            - name: Notify Slack
              uses: slackapi/slack-github-action@v4.0.0
              with:
                webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
                webhook-type: incoming-webhook
                payload: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*Frontend Merge Workflow Completed*"
                        }
                      },
                      {
                        "type": "section",
                        "fields": [
                          {
                            "type": "mrkdwn",
                            "text": "*Commit SHA:*\n${{ github.sha }}"
                          },
                          {
                            "type": "mrkdwn",
                            "text": "*Workflow Status:*\n${{ job.status }}"
                          }
                        ]
                      }
                    ]
                  }