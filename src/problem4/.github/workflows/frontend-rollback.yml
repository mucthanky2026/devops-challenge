name: Frontend Manual Pipeline

on:
    workflow_dispatch:
        inputs:
            commit:
                description: 'Commit to deploy'
                required: true
                type: string
            environment:
                description: 'Environment to deploy to'
                required: true
                type: string

jobs:
    validate-release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Validate release commit
              run: |
                if ! git rev-parse --verify ${{ inputs.commit }} >/dev/null 2>&1; then
                  echo "Commit ${{ inputs.commit }} does not exist."
                  exit 1
                fi
                echo "Commit ${{ inputs.commit }} exists."
            - name: Authenticate with AWS
              uses: aws-actions/configure-aws-credentials@v3
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                role-external-id: ${{ secrets.AWS_EXTERNAL_ID }}
                aws-region: ${{ vars.AWS_REGION }}
                mask-aws-account-id: true 
                role-session-name: frontend-manual-${{ github.run_id }}
            - name: Validate release on central artifact
              run: |
                aws s3 cp --recursive s3://${{ vars.AWS_S3_ARTIFACT_BUCKET }}/frontend/${{ inputs.commit }}/ out/
                if [ ! -d "out" ]; then
                  echo "Release artifact for commit ${{ inputs.commit }} does not exist in S3."
                  exit 1
                fi

                if [ -z "$(ls -A out)" ]; then
                  echo "Release artifact for commit ${{ inputs.commit }} is empty in S3."
                  exit 1
                fi

                if [ ! -f "out/index.html" ]; then
                  echo "Release artifact for commit ${{ inputs.commit }} is missing index.html in S3."
                  exit 1
                fi

                echo "Release artifact for commit ${{ inputs.commit }} exists in S3."

    approval-and-deploy:
        runs-on: ubuntu-latest
        needs: validate-release
        environment:
            name: ${{ inputs.environment }}
        steps:
            - name: Authorize AWS
              uses: aws-actions/configure-aws-credentials@v2
              with:
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}
                role-external-id: ${{ secrets.AWS_EXTERNAL_ID }}
                mask-aws-account-id: true
                role-session-name: frontend-manual-${{ github.run_id }}
            - name: Download build artifact from S3
              run: |
                aws s3 sync s3://${{ vars.AWS_S3_ARTIFACT_BUCKET }}/frontend/${{ inputs.commit }}/ out/ \
                --exact-timestamps
            - name: Upload to S3 for deployment
              run: |
                aws s3 cp --recursive out/ s3://${{ vars.AWS_S3_DEPLOY_BUCKET }}/ --acl private 
                aws s3 cp config/${{ inputs.environment }}/frontend/config.json s3://${{ vars.AWS_S3_DEPLOY_BUCKET }}/config.json --acl private

    verify:
        runs-on: ubuntu-latest
        needs: approval-and-deploy
        steps:
            - name: Verify deployment
              run: |
                curl -v https://${{ vars.FRONTEND_DOMAIN }}/index.html || exit 1
                curl -v https://${{ vars.FRONTEND_DOMAIN }} | grep "200 OK" 

    notify:
        runs-on: ubuntu-latest
        needs: [validate-release, approval-and-deploy, verify]
        steps:
            - name: Notify Slack
              uses: slackapi/slack-github-action@v4.0.0
              with:
                webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
                webhook-type: incoming-webhook
                payload: |
                  {
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*Frontend Merge Workflow Completed*"
                        }
                      },
                      {
                        "type": "section",
                        "fields": [
                          {
                            "type": "mrkdwn",
                            "text": "*Commit SHA:*\n${{ github.sha }}"
                          },
                          {
                            "type": "mrkdwn",
                            "text": "*Workflow Status:*\n${{ job.status }}"
                          }
                        ]
                      }
                    ]
                  }